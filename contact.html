        </div>

    <section class="page-section">
        <h1>Contact Me</h1>
        <div class="contact-content">
            <p>Feel free to reach out to me through any of the following channels:</p>
            <div class="contact-info">
                <div class="contact-item">
                    <h3>Email</h3>
                    <a href="mailto:ali7713meh17@gmail.com">ali7713meh17@gmail.com</a>
                </div>
                <div class="contact-item">
                    <h3>GitHub</h3>
                    <a href="https://github.com/alimehdikhani" target="_blank">github.com/alimehdikhani</a>
                </div>
                <div class="contact-item">
                    <h3>Instagram</h3>
                    <a href="https://instagram.com/alimehdikhani18" target="_blank">instagram.com/alimehdikhani18</a>
                </div>
            </div>
            <form class="contact-form" action="#" method="post">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </section>
